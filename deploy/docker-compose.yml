name: pull-lim

services:
  db:
    build:
      context: ../db
    image: pull-lim-db:latest
    container_name: pull-lim-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pullim}
      POSTGRES_USER: ${POSTGRES_USER:-pullim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pullim}
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pullim} -d ${POSTGRES_DB:-pullim}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: pull-lim-api:latest
    container_name: pull-lim-api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pullim}:${POSTGRES_PASSWORD:-pullim}@db:5432/${POSTGRES_DB:-pullim}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://pullim.hajin.xyz}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-sonnet-5}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-voyage/voyage-4-large}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: DAKER_2026_FINANCE_AI_CHALLENGE_BACKEND/deploy/Dockerfile
    image: pull-lim:latest
    container_name: pull-lim
    ports:
      - "127.0.0.1:${PORT:-18088}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
