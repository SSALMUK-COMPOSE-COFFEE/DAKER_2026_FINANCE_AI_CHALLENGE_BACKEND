# pullim.hajin.xyz — 풀림(PULL-LIM) 전용 서브도메인
# 설치: sudo cp /home/hajinkwonsee/developments/hackathon/DAKER_2026_FINANCE_AI_CHALLENGE/DAKER_2026_FINANCE_AI_CHALLENGE_BACKEND/deploy/pullim.hajin.xyz.nginx.conf /etc/nginx/sites-available/pullim.hajin.xyz
#       sudo ln -s /etc/nginx/sites-available/pullim.hajin.xyz /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#       sudo certbot --nginx -d pullim.hajin.xyz
#
# 컨테이너(pull-lim, 127.0.0.1:18088)는 루트 기준으로 서빙하므로 proxy_pass에 URI를 붙이지 않는다.
server {
    server_name pullim.hajin.xyz;

    client_max_body_size 60m;

    location / {
        proxy_pass http://127.0.0.1:18088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # LLM 초안 생성이 최대 90초까지 걸린다
        proxy_read_timeout 120s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pullim.hajin.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pullim.hajin.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = pullim.hajin.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name pullim.hajin.xyz;
    return 404; # managed by Certbot


}